<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cours d'acoustique — Direction B</title>
<link rel="stylesheet" href="../../../node_modules/katex/dist/katex.min.css" />
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/palette.css" />
<link rel="stylesheet" href="../shared/base.css" />
<link rel="stylesheet" href="b.css" />
</head>
<body>
<main class="home">
  <section class="text">
    <a class="wordmark" href="#">Cours d'acoustique</a>
    <h1>Faites des ondes.</h1>
    <p>Touchez le champ&nbsp;: chaque impulsion se propage, se réfléchit sur les bords et interfère avec les autres. C'est l'équation des ondes, résolue sous vos yeux.</p>
    <div class="actions">
      <a class="link-btn" href="chapitre.html">Commencer par l'équation des ondes</a>
      <a class="text-link" href="carte.html">Voir la carte du cours</a>
    </div>
  </section>
  <section class="field">
    <canvas id="field" role="img" aria-label="Champ de pression simulé en temps réel. Touchez ou cliquez pour émettre une impulsion."></canvas>
    <button class="listen"><span data-icon="sound"></span>Écouter</button>
    <div class="legend"><div class="name"><span>pression <span data-tex="p"></span></span><span>unité arbitraire</span></div><div class="ramp"></div><div class="ticks"><span>−</span><span>0</span><span>+</span></div></div>
  </section>
</main>
<script src="../../../node_modules/katex/dist/katex.min.js"></script>
<script src="../shared/luts.js"></script>
<script src="../shared/mock.js"></script>
<script src="../shared/icons.js"></script>
<script>
  document.fonts.ready.then(() => MOCK.hero(document.getElementById('field'), { seeds: [[0.35, 0.4, 0], [0.7, 0.7, 70], [0.6, 0.2, 130]], steps: 230 }));
</script>
</body>
</html>
