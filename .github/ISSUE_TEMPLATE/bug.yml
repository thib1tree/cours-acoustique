name: Bug
description: Un problème d'affichage, d'interaction, d'audio ou de performance.
labels: ['bug']
body:
  - type: input
    id: page
    attributes:
      label: Page concernée
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Appareil, système et navigateur
      placeholder: ex. iPhone 13, iOS 18, Safari
